<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RunStudio</title>
<meta name="description" content="Application de pilotage pour tapis de course Bluetooth FTMS (Domyos Run 500 et compatibles).">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect x="2" y="20" width="28" height="6" rx="3" fill="currentColor" opacity=".35"/><path d="M8 20 L14 8 L20 14 L26 6" stroke="var(--accent)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Run<b>Studio</b></span>
  </div>
  <nav class="tabs" role="tablist">
    <button data-view="run" class="active">Course</button>
    <button data-view="programs">Programmes</button>
    <button data-view="history">Historique</button>
    <button data-view="settings">Réglages</button>
  </nav>
  <div class="conn">
    <button id="btnProfile" class="chip profile" title="Changer de profil"><span class="av"></span><span class="pn"></span></button>
    <button id="btnDevice" class="chip"><i class="dot"></i><span>Tapis</span></button>
    <button id="btnHr" class="chip"><i class="dot"></i><span>♥ Cardio</span></button>
  </div>
</header>

<main>
  <!-- ===== COURSE ===== -->
  <section id="view-run" class="view active">
    <div id="programBanner" class="banner hidden"></div>
    <div id="tiles" class="tiles"></div>
    <div class="card chart-card">
      <div class="chart-head">
        <span id="chartTitle">Séance en direct</span>
        <span class="legend"><i class="lg-speed"></i>Vitesse <i class="lg-incl"></i>Inclinaison <i class="lg-hr"></i>Cardio <i class="lg-plan"></i>Plan</span>
      </div>
      <canvas id="liveChart" height="220"></canvas>
    </div>
    <div class="controls">
      <div class="ctl card">
        <div class="ctl-top"><span class="lbl">Vitesse</span><span class="tgt"><b id="tgtSpeed">0.0</b> km/h</span></div>
        <div class="ctl-row">
          <button class="step" data-act="spd-" aria-label="Moins vite">−</button>
          <div id="speedPresets" class="presets"></div>
          <button class="step" data-act="spd+" aria-label="Plus vite">+</button>
        </div>
      </div>
      <div class="ctl-main">
        <button id="btnStart" class="big go">▶ Démarrer</button>
        <button id="btnStop" class="big stop" title="Arrêter la séance">■ Stop</button>
      </div>
      <div class="ctl card">
        <div class="ctl-top"><span class="lbl">Inclinaison</span><span class="tgt"><b id="tgtIncline">0.0</b> %</span></div>
        <div class="ctl-row">
          <button class="step" data-act="inc-" aria-label="Moins incliné">−</button>
          <div id="inclinePresets" class="presets"></div>
          <button class="step" data-act="inc+" aria-label="Plus incliné">+</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== PROGRAMMES ===== -->
  <section id="view-programs" class="view">
    <div class="view-head">
      <h1>Programmes</h1>
      <div class="actions">
        <button id="btnQuickGoal" class="btn">🎯 Objectif rapide</button>
        <button id="btnNewProgram" class="btn primary">＋ Nouveau programme</button>
      </div>
    </div>
    <div id="programPlan"></div>
    <div id="programFilters" class="cats"></div>
    <div id="programList"></div>
  </section>

  <!-- ===== HISTORIQUE ===== -->
  <section id="view-history" class="view">
    <div class="view-head">
      <h1>Historique</h1>
      <div class="actions">
        <button id="btnExportAll" class="btn">⤓ Sauvegarde</button>
        <label class="btn">⤒ Restaurer<input id="fileImport" type="file" accept=".json,application/json" hidden></label>
      </div>
    </div>
    <div id="histStats" class="stats"></div>
    <div class="card chart-card">
      <div class="chart-head"><span>Kilomètres par semaine (12 dernières)</span></div>
      <canvas id="weekChart" height="180"></canvas>
    </div>
    <div id="histList" class="hist-list"></div>
  </section>

  <!-- ===== REGLAGES ===== -->
  <section id="view-settings" class="view">
    <div class="view-head"><h1>Réglages</h1></div>
    <div id="settingsForm" class="settings"></div>
  </section>
</main>

<dialog id="dlg"></dialog>
<div id="countdown" class="countdown hidden"></div>
<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
